<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Library Book Catalogue</h1>
    <p>CA Lab Exam &middot; Section 3MCA06 &middot; Set B</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Books</button>
          <button id="top-three" type="button">3 Cheapest Books</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by genre</h2>
        <form id="search-form" class="inline">
          <select name="genre" required>
            <option value="">Choose a genre...</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Price at most
            <input type="number" name="maxPrice" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Book</h2>
        <form id="add-form" class="stack">
        <label>Title
          <input type="text" name="title" required>
        </label>
        <label>Author
          <input type="text" name="author" required>
        </label>
        <label>Genre
          <select name="genre" required>
            <option value="">Choose...</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
          </select>
        </label>
        <label>Price
          <input type="number" name="price" step="1" required>
        </label>
          <button type="submit">Add Book</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
